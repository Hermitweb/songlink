name: Release - Docker & .NET Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: 'Release notes (optional)'
        required: false

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # === Build Docker Image ===
  docker-build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=sha
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/SongLink.Host.Core/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
  # === Run Unit Tests ===
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore src/SongLink.Protocol.Tests/SongLink.Protocol.Tests.csproj
    
    - name: Build
      run: dotnet build src/SongLink.Protocol.Tests/SongLink.Protocol.Tests.csproj -c Release --no-restore
    
    - name: Run Unit Tests
      run: dotnet test src/SongLink.Protocol.Tests/SongLink.Protocol.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: src/SongLink.Protocol.Tests/TestResults/*.trx
  
  # === Publish .NET Desktop App ===
  publish-windows:
    needs: [docker-build, test]
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore src/SongLink.Host.Core/SongLink.Host.Core.csproj
    
    - name: Build
      run: dotnet publish src/SongLink.Host.Core/SongLink.Host.Core.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --output ./publish
      
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: songlink-windows-x64
        path: ./publish
        retention-days: 30
    
  # === Release on GitHub ===
  release:
    needs: [docker-build, publish-windows]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: songlink-windows-x64
        path: ./windows-release
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ./windows-release/*
        generate_release_notes: true
