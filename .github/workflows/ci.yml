name: CI

on:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'SongLink.sln', 'scripts/**', '.github/workflows/ci.yml' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 核心（协议库 / Host.Core / AudioStream / UiaPick / 契约测试 / RemoteSim）必须通过——含 52 项 schema 契约与回归测试
      - name: Build & test core
        run: |
          dotnet test src/SongLink.Protocol.Tests/SongLink.Protocol.Tests.csproj -c Release --logger "trx;LogFileName=core.trx"
          dotnet build src/SongLink.Host.AudioStream/SongLink.Host.AudioStream.csproj -c Release
          dotnet build src/SongLink.Host.Adapters.UiaPick/SongLink.Host.Adapters.UiaPick.csproj -c Release
          dotnet build src/SongLink.Tools.UiaProbe/SongLink.Tools.UiaProbe.csproj -c Release
          dotnet build src/SongLink.RemoteSim/SongLink.RemoteSim.csproj -c Release

      # HMAC 端到端签名联调：起 requireFrameSig Host + RemoteSim --sign --verify，断言入站验签/出站签名通过
      - name: HMAC sig-smoke integration
        shell: bash
        run: bash scripts/sig-smoke.sh

      # WinRT 适配器（SMTC 读取 / 系统 OCR）依赖 Windows SDK 投影 pack；runner 若缺则 best-effort，不硬阻断核心流水线
      - name: Build WinRT adapters (Smtc + Ocr, best-effort)
        continue-on-error: true
        run: |
          dotnet build src/SongLink.Host.Adapters.Smtc/SongLink.Host.Adapters.Smtc.csproj -c Release
          dotnet build src/SongLink.Host.Adapters.Ocr/SongLink.Host.Adapters.Ocr.csproj -c Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
