# Project-wide Gradle settings
# 注意：这里**不能**加 -Dfile.encoding=UTF-8（Android Studio 模板默认带）。
# 仓库路径 E:\workspace\点歌台面板 含非 ASCII 字符，Gradle 8.6 把 fork 出来的测试 worker
# 的 classpath 写进 @argfile（用 daemon 的 Charset.defaultCharset()，即 file.encoding）。
# 若 daemon 用 UTF-8 写、而 Windows 上 fork 出的 JVM 按 native 编码（此处 GBK）解码该
# argfile，classpath 就全部失效，表现为 ClassNotFoundException: <每个测试类>。
# 去掉该参数后 daemon 与 worker 用同一个 native 编码，问题消失。
# （已实测：UTF-8 argfile → CNFE；GBK argfile → 正常；-Dfile.encoding / -Dsun.jnu.encoding 均无效，
#   因为 argfile 在 JVM 处理 -D 之前就已展开。）
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# 仓库路径 E:\workspace\点歌台面板 含非 ASCII 字符，AGP 默认会拒绝构建
android.overridePathCheck=true

# Kotlin
kotlin.code.style=official