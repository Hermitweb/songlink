<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SongLink 点歌台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>🎤 SongLink 点歌台</h1>
  <div id="conn" class="badge disconnected">未连接</div>
  <div id="user-wrap" hidden>
    <label>昵称 <input id="user" maxlength="20" placeholder="匿名"></label>
  </div>
  <div id="pin-wrap" hidden>
    <label>PIN <input id="pin" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="6 位"></label>
    <button id="btn-connect">连接</button>
  </div>
</header>

<main>
  <!-- 当前歌曲 -->
  <section id="now">
    <div class="art">
      <img id="art" alt="" src="" onerror="this.style.display='none'">
      <div class="art-placeholder" id="art-placeholder">♪</div>
    </div>
    <div class="meta">
      <div id="title" class="title">—</div>
      <div id="artist" class="artist">—</div>
      <div id="album" class="album"></div>
      <div class="status">
        <span id="status" class="dot">·</span>
        <span id="mode">—</span>
        <span id="time">0:00 / 0:00</span>
      </div>
    </div>
  </section>

  <!-- 控件 -->
  <section class="controls">
    <button id="btn-prev" title="上一首">⏮</button>
    <button id="btn-play" title="播放/暂停" class="primary">▶</button>
    <button id="btn-next" title="下一首">⏭</button>
  </section>

  <!-- 歌词 -->
  <section id="lyrics">
    <div class="empty">歌词加载中…</div>
  </section>

  <!-- 点歌队列 -->
  <section id="queue-section">
    <div class="row">
      <h2>📜 点歌队列 <span id="qcount" class="muted">(0)</span></h2>
      <div class="actions">
        <button id="btn-shuffle" class="ghost" title="随机打乱">🎲 打乱</button>
        <button id="btn-qclear" class="ghost danger" title="清空队列">🗑 清空</button>
      </div>
    </div>
    <ol id="queue-list" class="queue"></ol>
    <div id="queue-empty" class="empty">队列空 — 搜索或从热门区点歌</div>
  </section>

  <!-- 热门 -->
  <section id="trending-section">
    <h2>🔥 热门 <span class="muted">(点击 = 加入队列)</span></h2>
    <div id="trending" class="chips"></div>
  </section>

  <!-- 搜索 -->
  <section id="search">
    <h2>🔍 搜索 <span class="muted">(结果点击 = 立即播放,带 ⏩ = 加入队列)</span></h2>
    <div class="row">
      <input id="kw" placeholder="歌名 / 歌手">
      <button id="btn-search">搜</button>
    </div>
    <div id="results" class="results"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
