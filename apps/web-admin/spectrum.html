<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongLink - 音频频谱可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0f0f0f; 
            color: #fff; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container { 
            width: 100%; 
            max-width: 1400px; 
            padding: 2rem;
            text-align: center;
        }
        
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 1.5rem; 
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }
        
        .stat-value { 
            font-size: 2.5rem; 
            font-weight: bold; 
            margin-bottom: 0.5rem;
        }
        
        .stat-label { 
            color: #a0a0a0; 
            font-size: 0.875rem;
        }
        
        canvas {
            width: 100%;
            height: 300px;
            border-radius: 16px;
            background: rgba(0,0,0,0.3);
        }
        
        .controls {
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 0 0.5rem;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        
        footer {
            margin-top: 3rem;
            color: #666;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 SongLink 音频频谱可视化</h1>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="frequencyCount">64</div>
                <div class="stat-label">频段数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="updateRate">60 FPS</div>
                <div class="stat-label">更新频率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="volumeLevel">0%</div>
                <div class="stat-label">当前音量</div>
            </div>
        </div>
        
        <canvas id="spectrumCanvas"></canvas>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="toggleSimulation()">开始/暂停</button>
            <button class="btn btn-secondary" onclick="changeMode()">切换模式</button>
        </div>
        
        <footer>
            © 2026 SongLink M2.5 Audio Visualization | Powered by Canvas + requestAnimationFrame
        </footer>
    </div>
    
    <script src="spectrum.js"></script>
</body>
</html>
